services:
  mysql:
    image: mysql:8.0
    container_name: lighthouse-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-pass}
      MYSQL_DATABASE: lighthouse
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.db:/docker-entrypoint-initdb.d
    networks:
      - lighthouse-network
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      timeout: 20s
      retries: 10

  redis:
    image: redis/redis-stack:latest
    container_name: lighthouse-redis
    ports:
      - 6379:6379
      - 8001:8001 # RedisInsight web UI
    environment:
      REDIS_ARGS: '--save 60 1 --save 300 10 --save 900 100'
    volumes:
      - redis-data:/data
    networks:
      - lighthouse-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  localstack:
    image: localstack/localstack:latest
    container_name: lighthouse-localstack
    restart: unless-stopped
    ports:
      - '4566:4566' # LocalStack Gateway
      - '4571:4571' # External services
    environment:
      - SERVICES=s3,sqs,sns,dynamodb
      - DEBUG=0
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - ./scripts/init-localstack.sh:/docker-entrypoint-initaws.d/init-localstack.sh
    networks:
      - lighthouse-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4566/_localstack/health']
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  lighthouse-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
