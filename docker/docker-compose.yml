version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: lighthouse-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-pass}
      MYSQL_DATABASE: lighthouse
    ports:
      - '3307:3306'
    volumes:
      - lighthouse-mysql-data:/var/lib/mysql
      - ./init.db:/docker-entrypoint-initdb.d
    networks:
      - lighthouse-network
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      timeout: 20s
      retries: 10

  redis:
    image: redis/redis-stack:latest
    container_name: lighthouse-redis
    ports:
      - 6380:6379
      - 8002:8001 # RedisInsight web UI
    environment:
      REDIS_ARGS: '--save 60 1 --save 300 10 --save 900 100'
    volumes:
      - lighthouse-redis-data:/data
    networks:
      - lighthouse-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  localstack:
    image: localstack/localstack:latest
    container_name: lighthouse-localstack
    restart: unless-stopped
    ports:
      - '4567:4566' # LocalStack Gateway
      - '4572:4571' # External services
    environment:
      - SERVICES=s3,sqs,sns,dynamodb
      - DEBUG=0
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - ./scripts/init-localstack.sh:/docker-entrypoint-initaws.d/init-localstack.sh
    networks:
      - lighthouse-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4566/_localstack/health']
      interval: 5s
      timeout: 5s
      retries: 5

  # API Service
  api:
    build:
      context: ../
      dockerfile: docker/Dockerfile.packages
      target: api
    container_name: lighthouse-api
    restart: unless-stopped
    ports:
      - '8000:3001'
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=mysql://root:${MYSQL_ROOT_PASSWORD:-pass}@mysql:3306/lighthouse
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AWS_ENDPOINT=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-minimum-32-characters-long}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      - lighthouse-network
    volumes:
      # Optional: Mount logs directory for debugging
      - ../logs/api:/app/logs

  # Admin Dashboard Service
  admin:
    build:
      context: ../
      dockerfile: docker/Dockerfile.packages
      target: admin
    container_name: lighthouse-admin
    restart: unless-stopped
    ports:
      - '8888:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://api:3001
      - NEXT_PUBLIC_APP_NAME=Lighthouse Admin
    depends_on:
      - api
    networks:
      - lighthouse-network
    volumes:
      # Optional: Mount for Next.js cache in development
      - ../apps/admin/.next/cache:/app/.next/cache

  # Development service (optional - for local development with hot reload)
  # Uncomment to use development mode with volume mounts
  # dev:
  #   build:
  #     context: ../
  #     dockerfile: docker/Dockerfile.packages
  #     target: development
  #   container_name: lighthouse-dev
  #   ports:
  #     - '3000:3000'
  #     - '3001:3001'
  #   environment:
  #     - NODE_ENV=development
  #     - DATABASE_URL=mysql://root:${MYSQL_ROOT_PASSWORD:-pass}@mysql:3306/lighthouse
  #     - REDIS_URL=redis://redis:6379
  #   volumes:
  #     - ../:/workspace
  #     - /workspace/node_modules
  #     - /workspace/apps/admin/node_modules
  #     - /workspace/apps/api/node_modules
  #   depends_on:
  #     - mysql
  #     - redis
  #     - localstack
  #   networks:
  #     - lighthouse-network
  #   command: pnpm nx run-many --target=serve --all --parallel

networks:
  lighthouse-network:
    driver: bridge

volumes:
  lighthouse-mysql-data:
    driver: local
  lighthouse-redis-data:
    driver: local
